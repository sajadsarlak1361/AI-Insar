[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-insar"
version = "0.1.0"
description = "SLC-first desktop InSAR workbench: interferograms, coherence, unwrapping, SBAS, and a displacement mask"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AI Insar contributors" }]
keywords = ["insar", "sar", "slc", "sbas", "remote-sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ai-insar = "ai_insar.cli:main"

[project.gui-scripts]
ai-insar-gui = "ai_insar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
